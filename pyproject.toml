[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-health-console"
dynamic = ["version"]
description = "Read-only Azure health view: pick a resource, see what it depends on and whether any of it is unhealthy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Sonego da Silva" }]
keywords = ["azure", "health", "monitoring", "triage", "cost", "security", "observability"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "flask>=3.0,<4",
  "requests>=2.32,<3",
  "azure-identity>=1.17,<2",
  "fpdf2>=2.8,<3",
  "ruamel.yaml>=0.18,<0.20",
  "keyring>=25,<26",
  "truststore>=0.10,<0.11",
  "cryptography>=43,<51",
]

[project.urls]
Homepage = "https://github.com/RafaelSonego/azure-health-console"
Changelog = "https://github.com/RafaelSonego/azure-health-console/blob/main/CHANGELOG.md"
Issues = "https://github.com/RafaelSonego/azure-health-console/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
azure-health-console = "healthconsole.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["healthconsole*"]

[tool.setuptools.package-data]
healthconsole = ["release-signing.pem", "profiles/*.yaml", "report_templates/*.html", "web/templates/*.html", "web/static/*", "web/static/js/*", "web/static/vendor/*", "diagram_icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
